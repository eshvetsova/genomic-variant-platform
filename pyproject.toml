[project]
name = "genomic-variant-platform"
version = "0.1.0"
description = "Genomic Variant Analysis Platform API"
authors = [
    {name = "eshvetsova"}
]
requires-python = ">=3.15,<4.0"
dependencies = [
    "fastapi (>=0.162.7,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "boto3 (>=1.44.3,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.mypy]
files = ["app"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=6.0.0,<8.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: tests that require a real PostgreSQL database"]
